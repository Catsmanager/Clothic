spring.application.name=ClothicBackend

# Supabase 사용자 토큰 검증 (F-02)
# 발급자: https://<project-ref>.supabase.co/auth/v1 . 대상(aud)은 Supabase 기본값 authenticated.
# 서명 방식은 둘 중 하나만 설정한다. 비대칭 키(ES256/RS256)는 jwk-set-uri, 레거시 대칭 키(HS256)는 hmac-secret.
# 둘 다 비어 있으면 /api/health만 응답하고 보호 경로는 모두 401로 거부한다. 비밀키 원문은 저장소에 두지 않고 환경변수로 넘긴다.
clothic.auth.issuer=${CLOTHIC_AUTH_ISSUER:}
clothic.auth.audience=${CLOTHIC_AUTH_AUDIENCE:authenticated}
clothic.auth.jwk-set-uri=${CLOTHIC_AUTH_JWK_SET_URI:}
clothic.auth.hmac-secret=${CLOTHIC_AUTH_HMAC_SECRET:}

# 자체 인증 (S-02). 서명 키(32바이트 이상)를 설정하면 서버가 직접 가입·로그인을 처리하고 자신이 발급한 토큰만 받는다.
# 위 Supabase 검증 설정(jwk-set-uri, hmac-secret)과 함께 설정하면 기동하지 않는다. 서버 소유 스키마(db/migration)가 필요하다.
clothic.auth.local.signing-secret=${CLOTHIC_AUTH_SIGNING_SECRET:}
clothic.auth.local.issuer=${CLOTHIC_AUTH_LOCAL_ISSUER:clothic}
clothic.auth.local.access-token-ttl=${CLOTHIC_AUTH_ACCESS_TOKEN_TTL:15m}
clothic.auth.local.refresh-token-ttl=${CLOTHIC_AUTH_REFRESH_TOKEN_TTL:30d}

# 브라우저의 개발 출처를 명시적으로 허용한다. 미설정 시 교차 출처 호출은 거부한다.
clothic.web.allowed-origins=${CLOTHIC_WEB_ALLOWED_ORIGINS:}

# PostgreSQL 연결 (F-03)
# 접속 문자열·계정은 환경변수로만 받는다. 백엔드 전용 역할을 쓰고 관리자 계정을 기본값으로 두지 않는다.
# 미설정 시 서버는 기동하되 DB 조회 시점에 실패한다(상태 확인·토큰 검증은 영향 없음).
spring.datasource.url=${CLOTHIC_DB_URL:jdbc:postgresql://localhost:5432/clothic}
spring.datasource.username=${CLOTHIC_DB_USERNAME:clothic_backend}
spring.datasource.password=${CLOTHIC_DB_PASSWORD:}
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.maximum-pool-size=${CLOTHIC_DB_POOL_SIZE:5}
# 기존 Supabase 스키마를 서버가 만들거나 바꾸지 않는다. 매핑 검증(validate)은 DB가 있는 테스트에서 켠다.
spring.jpa.hibernate.ddl-auto=none
# 서버 소유 스키마(db/migration)의 Flyway 적용. 기본은 끈다: Supabase DB에 연결한 서버는 테이블을 만들거나 바꾸지 않는다.
# 직접 운영하는 PostgreSQL에서만 CLOTHIC_DB_MIGRATE=true로 켠다. 테이블을 만들 권한이 있는 계정이 필요하다.
spring.flyway.enabled=${CLOTHIC_DB_MIGRATE:false}
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
