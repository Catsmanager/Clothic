spring.application.name=ClothicBackend

# Supabase 사용자 토큰 검증 (F-02)
# 발급자: https://<project-ref>.supabase.co/auth/v1 . 대상(aud)은 Supabase 기본값 authenticated.
# 서명 방식은 둘 중 하나만 설정한다. 비대칭 키(ES256/RS256)는 jwk-set-uri, 레거시 대칭 키(HS256)는 hmac-secret.
# 둘 다 비어 있으면 /api/health만 응답하고 보호 경로는 모두 401로 거부한다. 비밀키 원문은 저장소에 두지 않고 환경변수로 넘긴다.
clothic.auth.issuer=${CLOTHIC_AUTH_ISSUER:}
clothic.auth.audience=${CLOTHIC_AUTH_AUDIENCE:authenticated}
clothic.auth.jwk-set-uri=${CLOTHIC_AUTH_JWK_SET_URI:}
clothic.auth.hmac-secret=${CLOTHIC_AUTH_HMAC_SECRET:}
