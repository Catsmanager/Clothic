name: EAS Build (production)

# 수동 트리거 전용. 실제 빌드는 EXPO_TOKEN secret이 등록돼야 동작한다.
# (자동 트리거를 원하면 on.push로 develop/main 등을 추가)
on:
  workflow_dispatch:
    inputs:
      platform:
        description: '빌드 플랫폼'
        required: true
        default: ios
        type: choice
        options: [ios, android, all]

jobs:
  build:
    name: EAS production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: EAS build
        run: eas build --platform ${{ inputs.platform }} --profile production --non-interactive --no-wait
