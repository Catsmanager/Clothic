name: Release iOS to TestFlight

# main의 CI가 성공한 뒤 production 빌드를 만들고, app-store 환경 승인을 거쳐
# TestFlight에 업로드한다. 실제 App Store 공개는 Apple 심사를 거쳐야 한다.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      submit:
        description: '빌드 완료 후 TestFlight에 업로드'
        required: true
        default: true
        type: boolean

concurrency:
  group: ios-release-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify release commit
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        github.event.workflow_run.conclusion == 'success'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify deterministic release gates
        run: npm run check

  build:
    name: Build iOS production binary
    needs: verify
    if: needs.verify.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Build iOS production binary
        run: eas build --platform ios --profile production --non-interactive --wait

  submit:
    name: Upload build to TestFlight
    needs: build
    if: >-
      ${{
        needs.build.result == 'success' &&
        (github.event_name == 'workflow_run' || inputs.submit == true)
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: app-store
      url: https://appstoreconnect.apple.com
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Submit latest iOS build to TestFlight
        run: eas submit --platform ios --profile production --latest --non-interactive
