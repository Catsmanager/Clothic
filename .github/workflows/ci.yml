name: CI

# 모든 PR(작업 브랜치를 대상으로 한 PR 포함)과 main 푸시를 검증한다.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# 같은 ref에서 새 푸시가 오면 이전 실행을 취소한다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Static · Core flow · Habit proxy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify deterministic release gates
        run: npm run check

      - name: Verify app version consistency
        run: node scripts/check-release.mjs versions
