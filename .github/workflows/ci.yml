name: CI

# PR 검증 + develop/main 푸시 시 결정론적 정적·핵심 흐름 검사를 수행한다.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# 같은 ref에서 새 푸시가 오면 이전 실행을 취소한다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Static · Core flow · Habit proxy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify deterministic release gates
        run: npm run check
